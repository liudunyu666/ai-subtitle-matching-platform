services:
  - type: web
    name: ai-subtitle-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PUBLIC_BASE_URL
        value: https://ai-subtitle-backend-90pz.onrender.com
